name: "template"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: circleci/ruby:2.6.3-stretch-node-browsers-legacy
      options: --user 1001
    steps:
      - uses: actions/checkout@v2
      - run: echo "aaaaaa"
      - run: sleep 10 && exit 0
  deploy_test:
    needs: test
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: output some info
        run: echo "okay"
